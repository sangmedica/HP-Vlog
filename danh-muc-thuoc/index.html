<meta charset="UTF-8">
<title>Danh Mục Thuốc TMC</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #F5F8F6;
    --surface: #FFFFFF;
    --surface-alt: #E7F0EC;
    --ink: #16261F;
    --ink-muted: #5C6E66;
    --accent: #0E7C66;
    --accent-strong: #0B6552;
    --accent-ink: #FFFFFF;
    --line: #DDE7E2;
    --chip-bg: #EAF1EE;
    --chip-ink: #33473F;
    --shadow: 0 -8px 30px rgba(15, 35, 28, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1512;
      --surface: #16211D;
      --surface-alt: #1C2A24;
      --ink: #EAF3EF;
      --ink-muted: #9AB0A6;
      --accent: #3FD1AE;
      --accent-strong: #59DDBC;
      --accent-ink: #06231C;
      --line: #28352F;
      --chip-bg: #1C2A24;
      --chip-ink: #BFE0D4;
      --shadow: 0 -8px 30px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1512;
    --surface: #16211D;
    --surface-alt: #1C2A24;
    --ink: #EAF3EF;
    --ink-muted: #9AB0A6;
    --accent: #3FD1AE;
    --accent-strong: #59DDBC;
    --accent-ink: #06231C;
    --line: #28352F;
    --chip-bg: #1C2A24;
    --chip-ink: #BFE0D4;
    --shadow: 0 -8px 30px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow-x: hidden; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    padding: max(14px, env(safe-area-inset-top)) 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-bottom: 1px solid transparent;
  }
  .topbar.scrolled { border-bottom-color: var(--line); }

  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .brand .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .brand h1 {
    margin: 2px 0 0;
    font-size: 21px;
    font-weight: 750;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .brand .count {
    font-size: 12px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    padding-top: 4px;
  }

  .search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    width: 17px;
    height: 17px;
    color: var(--ink-muted);
    pointer-events: none;
  }
  #search {
    width: 100%;
    border: none;
    border-radius: 12px;
    background: var(--surface-alt);
    color: var(--ink);
    font-size: 16px;
    padding: 11px 36px 11px 36px;
    outline: none;
    -webkit-appearance: none;
  }
  #search::placeholder { color: var(--ink-muted); }
  #clearBtn {
    position: absolute;
    right: 8px;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    background: var(--ink-muted);
    color: var(--surface);
    opacity: 0.55;
    font-size: 13px;
    line-height: 22px;
    text-align: center;
    padding: 0;
    display: none;
  }
  #clearBtn.show { display: block; }

  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 16px 12px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--chip-bg);
    color: var(--chip-ink);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    white-space: nowrap;
    cursor: pointer;
  }
  .chip .n {
    font-variant-numeric: tabular-nums;
    opacity: 0.65;
    margin-left: 3px;
  }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .chip.active .n { opacity: 0.85; }

  main { flex: 1; padding-bottom: 40px; }

  .section-head {
    position: sticky;
    top: 96px;
    z-index: 10;
    background: var(--surface-alt);
    color: var(--accent-strong);
    font-size: 12.5px;
    font-weight: 750;
    letter-spacing: 0.02em;
    padding: 7px 16px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .row {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .row:active { background: var(--surface-alt); }
  .row .name { font-size: 15.5px; font-weight: 650; }
  .row .active-ing { font-size: 12.5px; color: var(--ink-muted); }
  .row .indication {
    font-size: 12.5px;
    color: var(--accent-strong);
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .row .group-tag {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 1px;
  }

  .empty {
    padding: 60px 24px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 14px;
  }

  /* bottom sheet */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6, 15, 12, 0.42);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
    z-index: 30;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 560px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    box-shadow: var(--shadow);
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 31;
    max-height: 84vh;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.open { transform: translateY(0); }

  .sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    margin: 10px auto 4px;
  }

  .sheet-body { overflow-y: auto; padding: 4px 20px 28px; }

  .sheet-tag {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--accent-strong);
    background: var(--surface-alt);
    border-radius: 999px;
    padding: 4px 11px;
    margin-top: 8px;
  }
  .sheet-body h2 {
    font-size: 20px;
    font-weight: 750;
    margin: 12px 0 2px;
    text-wrap: balance;
  }

  .field {
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }
  .field:first-of-type { border-top: none; margin-top: 6px; }
  .field .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .field .value {
    font-size: 15px;
    margin-top: 3px;
    line-height: 1.45;
  }
  .field.indication .value { color: var(--accent-strong); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .sheet, .backdrop { transition: none; }
  }
</style>

<div class="app">
  <header class="topbar" id="topbar">
    <div class="brand">
      <div>
        <div class="eyebrow">T-MATSUOKA Medical Center</div>
        <h1>Danh Mục Thuốc</h1>
      </div>
      <div class="count" id="resultCount"></div>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="search" type="text" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Tên thuốc, hoạt chất, chỉ định...">
      <button id="clearBtn" aria-label="Xóa">&#10005;</button>
    </div>
  </header>

  <div class="chips" id="chips"></div>

  <main id="list"></main>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

": "Nhiễm khuẩn (kháng sinh nhóm Macrolid)"}];
const GROUP_ORDER = ["Tim mạch", "Tiêu hóa", "Kháng sinh - Kháng virus", "Hô hấp - Dị ứng", "Cơ - Xương - Khớp", "Sản - Phụ khoa", "Gan - Thận - Tiết niệu", "Thần kinh", "Mắt", "Kháng nấm", "Thuốc dùng ngoài da", "Thực phẩm bổ sung", "Khác", "Thực phẩm chức năng", "Thiết bị y tế", "Mỹ phẩm"];

const state = { query: "", activeGroup: null };

const chipsEl = document.getElementById("chips");
const listEl = document.getElementById("list");
const searchEl = document.getElementById("search");
const clearBtn = document.getElementById("clearBtn");
const resultCountEl = document.getElementById("resultCount");
const topbarEl = document.getElementById("topbar");
const backdropEl = document.getElementById("backdrop");
const sheetEl = document.getElementById("sheet");
const sheetBodyEl = document.getElementById("sheetBody");

function normalize(s) {
  return (s || "").toLowerCase();
}

function groupCounts() {
  const counts = {};
  for (const d of DRUGS) counts[d.group] = (counts[d.group] || 0) + 1;
  return counts;
}

function renderChips() {
  const counts = groupCounts();
  const frag = document.createDocumentFragment();

  const allChip = document.createElement("button");
  allChip.className = "chip" + (state.activeGroup === null ? " active" : "");
  allChip.innerHTML = `Tất cả <span class="n">${DRUGS.length}</span>`;
  allChip.onclick = () => { state.activeGroup = null; renderChips(); renderList(); };
  frag.appendChild(allChip);

  for (const g of GROUP_ORDER) {
    if (!counts[g]) continue;
    const chip = document.createElement("button");
    chip.className = "chip" + (state.activeGroup === g ? " active" : "");
    chip.innerHTML = `${g} <span class="n">${counts[g]}</span>`;
    chip.onclick = () => { state.activeGroup = (state.activeGroup === g ? null : g); renderChips(); renderList(); };
    frag.appendChild(chip);
  }
  chipsEl.innerHTML = "";
  chipsEl.appendChild(frag);
}

function matchesQuery(d, q) {
  if (!q) return true;
  return normalize(d.name).includes(q) ||
    normalize(d.active).includes(q) ||
    normalize(d.indication).includes(q);
}

function filteredDrugs() {
  const q = normalize(state.query.trim());
  return DRUGS.filter(d => (state.activeGroup === null || d.group === state.activeGroup) && matchesQuery(d, q));
}

function rowHtml(d) {
  return `<div class="row" data-id="${d.id}">
    <div class="name">${escapeHtml(d.name)}</div>
    ${d.active ? `<div class="active-ing">${escapeHtml(d.active)}</div>` : ""}
    ${d.indication ? `<div class="indication">${escapeHtml(d.indication)}</div>` : ""}
    ${state.activeGroup === null ? `<div class="group-tag">${escapeHtml(d.group)}</div>` : ""}
  </div>`;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function renderList() {
  const results = filteredDrugs();
  const q = state.query.trim();

  if (results.length === 0) {
    listEl.innerHTML = `<div class="empty">Không tìm thấy thuốc phù hợp.</div>`;
    resultCountEl.textContent = "";
    return;
  }

  if (q || state.activeGroup !== null) {
    resultCountEl.textContent = `${results.length} kết quả`;
  } else {
    resultCountEl.textContent = `${DRUGS.length} loại thuốc`;
  }

  if (q) {
    // flat results while searching, grouped list otherwise
    listEl.innerHTML = results.map(rowHtml).join("");
  } else {
    const byGroup = {};
    for (const d of results) (byGroup[d.group] = byGroup[d.group] || []).push(d);
    const order = state.activeGroup ? [state.activeGroup] : GROUP_ORDER;
    let html = "";
    for (const g of order) {
      const items = byGroup[g];
      if (!items || !items.length) continue;
      html += `<div class="section-head">${escapeHtml(g)} (${items.length})</div>`;
      html += items.map(rowHtml).join("");
    }
    listEl.innerHTML = html;
  }

  listEl.querySelectorAll(".row").forEach(el => {
    el.addEventListener("click", () => openSheet(Number(el.dataset.id)));
  });
}

function fieldHtml(label, value, extraClass) {
  if (!value) return "";
  return `<div class="field ${extraClass || ""}">
    <div class="label">${label}</div>
    <div class="value">${escapeHtml(value)}</div>
  </div>`;
}

function openSheet(id) {
  const d = DRUGS.find(x => x.id === id);
  if (!d) return;
  sheetBodyEl.innerHTML = `
    <div class="sheet-tag">${escapeHtml(d.group)}</div>
    <h2>${escapeHtml(d.name)}</h2>
    ${fieldHtml("Chỉ định", d.indication, "indication")}
    ${fieldHtml("Hoạt chất", d.active)}
    ${fieldHtml("Hàm lượng", d.content)}
    ${fieldHtml("Đường dùng", d.usage)}
    ${fieldHtml("Xuất xứ", d.origin)}
    ${fieldHtml("Mã thuốc", d.code)}
  `;
  backdropEl.classList.add("open");
  sheetEl.classList.add("open");
}

function closeSheet() {
  backdropEl.classList.remove("open");
  sheetEl.classList.remove("open");
}

backdropEl.addEventListener("click", closeSheet);

searchEl.addEventListener("input", () => {
  state.query = searchEl.value;
  clearBtn.classList.toggle("show", state.query.length > 0);
  renderList();
});
clearBtn.addEventListener("click", () => {
  searchEl.value = "";
  state.query = "";
  clearBtn.classList.remove("show");
  searchEl.focus();
  renderList();
});

window.addEventListener("scroll", () => {
  topbarEl.classList.toggle("scrolled", window.scrollY > 2);
}, { passive: true });

renderChips();
renderList();
</script>
