backend:
  name: github
  repo: sangmedica/HP-Vlog
  branch: main
  base_url: https://sangmedica.netlify.app
  auth_endpoint: .netlify/functions/auth

# 画像などのアップロード先
media_folder: "images/blog-uploads"
public_folder: "/images/blog-uploads"

collections:
  - name: "news"
    label: "News"
    files:
      - file: "news/categories.json"
        label: "Newsカテゴリー一覧"
        name: "news_categories"
        fields:
          - label: "カテゴリー（新しいカテゴリーを追加する場合はここに1行追加してください。追加するとNews記事のカテゴリー選択肢にすぐ反映されます）"
            name: "categories"
            widget: "list"
            summary: "{{label}}"
            fields:
              - { label: "スラッグ（英数字とハイフン、他のカテゴリーと重複不可）", name: "slug", widget: "string" }
              - { label: "表示名", name: "label", widget: "string" }

      - file: "news/news.json"
        label: "News一覧"
        name: "news_items"
        fields:
          - label: "お知らせ（新しいものを追加する場合はここにリストを1件追加してください。表示は自動的に日付の新しい順・最大20件になります）"
            name: "items"
            widget: "list"
            summary: "{{date}}　{{title}}"
            fields:
              - label: "日付"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
              - label: "カテゴリー（未設定も可。新しいカテゴリーは上の「Newsカテゴリー一覧」から追加してください）"
                name: "category"
                widget: "relation"
                collection: "news"
                file: "news_categories"
                search_fields: ["categories.*.label"]
                value_field: "categories.*.slug"
                display_fields: ["categories.*.label"]
                required: false
              - { label: "タイトル（本文）", name: "title", widget: "string" }

  - name: "community"
    label: "コミュニティページ"
    files:
      - file: "community/featured.json"
        label: "代表アプリ（パスワード不要でトップページに公開表示）"
        name: "community_featured"
        fields:
          - { label: "アプリ名", name: "title", widget: "string", required: false }
          - { label: "アプリのURL", name: "url", widget: "string", required: false }
          - label: "使い方解説動画（任意／mp4推奨、100MBまで。GitHubの上限が100MBのため、安全のため90MB程度までに収めてください。容量が大きい場合は、iPhoneなら『メール』アプリで動画を送る際に表示される『ビデオサイズ』を『小』か『中』に選ぶと簡単に圧縮できます。Androidなら『Files by Google』アプリの『動画を圧縮』機能が使えます）"
            name: "video"
            widget: "file"
            media_folder: "/media/community-video-uploads"
            public_folder: "/media/community-video-uploads"
            required: false
          - { label: "説明文", name: "description", widget: "text", required: false }

      - file: "community/content.json"
        label: "コミュニティページ内容"
        name: "community_content"
        fields:
          - label: "Notion 閲覧専用リンク（任意／設定すると『Notion（閲覧専用）』欄が表示されます）"
            name: "notionUrl"
            widget: "string"
            required: false
          - label: "紹介するアプリ"
            name: "apps"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "アプリ名", name: "title", widget: "string" }
              - label: "URL用スラッグ（半角英数字とハイフンのみ／アクセス数の集計に使用／他アプリと重複不可／作成後は変更しない）"
                name: "slug"
                widget: "string"
                pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "半角小文字・数字・ハイフンのみ使用できます"]
              - label: "カテゴリー（例：医療系、語学系、生産性など。自由入力。既存アプリと同じ表記にすると一覧でまとまります）"
                name: "category"
                widget: "string"
                required: false
              - { label: "アプリのURL（任意）", name: "url", widget: "string", required: false }
              - label: "紹介動画（任意／mp4推奨、100MBまで。GitHubの上限が100MBのため、安全のため90MB程度までに収めてください。容量が大きい場合は、iPhoneなら『メール』アプリで動画を送る際に表示される『ビデオサイズ』を『小』か『中』に選ぶと簡単に圧縮できます。Androidなら『Files by Google』アプリの『動画を圧縮』機能が使えます）"
                name: "video"
                widget: "file"
                media_folder: "/media/community-video-uploads"
                public_folder: "/media/community-video-uploads"
                required: false
              - { label: "説明文（任意）", name: "description", widget: "text", required: false }

  - name: "blog"
    label: "ブログ"
    files:
      - file: "blog/posts.json"
        label: "ブログ記事一覧"
        name: "blog_posts"
        fields:
          - label: "カテゴリー定義（新しいカテゴリーを追加する場合はここに1行追加してください）"
            name: "categories"
            widget: "list"
            summary: "{{label}}"
            fields:
              - { label: "スラッグ（英数字とハイフン）", name: "slug", widget: "string" }
              - { label: "表示名", name: "label", widget: "string" }

          - label: "記事"
            name: "posts"
            widget: "list"
            summary: "{{title}}（{{date}}）"
            fields:
              - { label: "タイトル", name: "title", widget: "string" }
              - label: "URL用スラッグ（半角英数字とハイフンのみ／他の記事と重複不可／作成後は変更しない）"
                name: "slug"
                widget: "string"
                pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "半角小文字・数字・ハイフンのみ使用できます"]
              - label: "抜粋（記事一覧カードに表示される説明文）"
                name: "excerpt"
                widget: "text"
              - label: "公開日"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
              - label: "カテゴリー"
                name: "category"
                widget: "select"
                options:
                  - { label: "産業保健", value: "occupational-health" }
                  - { label: "医療者教育", value: "medical-education" }
                  - { label: "研修プログラム設計", value: "training-design" }
              - label: "サムネイル写真（未設定の場合は自動デザインの背景になります）"
                name: "image"
                widget: "image"
                required: false
              - label: "動画（任意／スマホ撮影などの動画ファイルを添付できます。mp4推奨、100MBまで。GitHubの上限が100MBのため、安全のため90MB程度までに収めてください。容量が大きい場合は、iPhoneなら『メール』アプリで動画を送る際に表示される『ビデオサイズ』を『小』か『中』に選ぶと簡単に圧縮できます。Androidなら『Files by Google』アプリの『動画を圧縮』機能が使えます）"
                name: "video"
                widget: "file"
                media_folder: "/media/blog-video-uploads"
                public_folder: "/media/blog-video-uploads"
                required: false
              - label: "本文（見出しにしたい行の先頭に「## 」を付け、段落の間は1行空けてください）"
                name: "body"
                widget: "text"
